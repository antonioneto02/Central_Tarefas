services:
  central-tarefas:
    image: central-tarefas:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: central-tarefas
    restart: unless-stopped
    ports:
      - "3011:3011"
    env_file:
      - .env
    environment:
      CERT_DIR: C:/certs
    volumes:
      # Pasta inteira (nao so o codigo copiado na imagem): restart via
      # supervisor pega o que estiver salvo no disco na hora, sem rebuild.
      - C:/Projetos/Central_Tarefas:C:/app
      - C:/Projetos/Certificados:C:/certs:ro
